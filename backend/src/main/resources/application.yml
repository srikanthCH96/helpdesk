server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: helpdesk-pro-enterprise

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:helpdesk_pro}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:helpdesk_app}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_THIS_TO_A_SECURE_256_BIT_SECRET_KEY_FOR_DEV_ONLY_2026}
    access-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  storage:
    s3-bucket: ${AWS_S3_BUCKET:}
    aws-region: ${AWS_REGION:us-east-1}
    local-upload-dir: ${LOCAL_UPLOAD_DIR:./uploads}
  mail:
    from: ${SMTP_FROM:no-reply@helpdeskpro.io}
    enabled: ${SMTP_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
