services:
  mysql:
    image: mysql:8.4
    container_name: helpdesk_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-helpdesk_pro}
      MYSQL_USER: ${MYSQL_USER:-helpdesk_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-HelpDeskLocal2026!}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootLocal2026!}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: helpdesk_api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-helpdesk_pro}
      MYSQL_USER: ${MYSQL_USER:-helpdesk_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-HelpDeskLocal2026!}
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_TO_A_SECURE_256_BIT_JWT_SECRET_FOR_LOCAL_DOCKER}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:80
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: helpdesk_web
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
